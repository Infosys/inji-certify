## Application Name
spring.application.name=certify,certify-plugin
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.name=certify
spring.profiles.active=local

server.port=8090
server.servlet.path=/v1/certify

openapi.info.title=Inji Certify Service
openapi.info.description=Rest Endpoints for operations related to certify
openapi.info.version=1.0
openapi.info.license.name=Apache-2.0
openapi.info.license.url=https://www.apache.org/licenses/LICENSE-2.0
mosipbox.public.url=http://localhost:${server.port}
openapi.service.server.url=${mosipbox.public.url}${server.servlet.path}
openapi.service.server.description=Inji Certify Service
springdoc.swagger-ui.disable-swagger-default-url=true
spring.mvc.servlet.path=${server.servlet.path}

#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.security=DEBUG

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.main.allow-bean-definition-overriding=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

